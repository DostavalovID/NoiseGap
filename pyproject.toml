[project]
name = "noisegap"
version = "0.1.0"
description = "Auditable log-Mel noise robustness experiments built on autrainer."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "audiofile>=1.3.0,<2",
    "autrainer==0.8.1",
    "PyYAML>=6.0.1,<7",
    "scipy>=1.10,<2",
    "torch>=2.0.0,<3",
    "torchaudio>=2.0.0,<3",
]

[project.scripts]
noisegap-generate = "noisegap.experiments.cli:main"
noisegap-generate-speechcommands = "noisegap.experiments.speechcommands_cli:main"
noisegap-generate-waveform = "noisegap.experiments.speechcommands_cli:main"
noisegap-prepare-timit = "noisegap.datasets.timit:main"
noisegap-prepare-speechcommands-noise = "noisegap.datasets.speechcommands:main"
noisegap-run = "noisegap.experiments.run:main"
noisegap-summarize = "noisegap.analysis:main"
noisegap-aggregate-seeds = "noisegap.statistics:main"
noisegap-diagnose = "noisegap.diagnostics:main"
noisegap-contrast = "noisegap.contrasts:main"
noisegap-train = "noisegap.training.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.1.1,<9",
    "ruff==0.12.8",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noisegap"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "Q",
    "ANN",
    "BLE",
    "B",
    "C4",
    "ISC",
    "ICN",
    "LOG",
    "G",
    "PYI",
    "PT",
    "RET",
    "SIM",
    "TC",
    "ERA",
]
ignore = ["ANN401"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
