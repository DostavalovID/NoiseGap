defaults:
  - _self_
  - dataset: TIMIT-sentencetype-16k
  - model: Cnn10-32k-T
  - optimizer: Adam
  - scheduler: None
  - plotting: Default
  - /hydra/callbacks:
      - ConfigDirSnapshot
  - override hydra/sweeper: autrainer_filter_sweeper

results_dir: results
experiment_id: noisegap

training_type: epoch
eval_frequency: 1
save_frequency: 9999
inference_batch_size: ${batch_size}
device: cuda:0
progress_bar: true
continue_training: false
remove_continued_runs: false
save_train_outputs: false
save_dev_outputs: false
save_test_outputs: true

hydra:
  mode: RUN
  output_subdir: null
  run:
    dir: ${results_dir}/${experiment_id}
