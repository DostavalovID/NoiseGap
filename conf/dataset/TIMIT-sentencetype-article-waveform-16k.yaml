id: TIMIT-sentencetype-article-waveform-16k
_target_: noisegap.datasets.TimitSentenceType

# Exact legacy article metadata, but load the original 16 kHz utterances so
# corruption happens before the CNN10 frontend.
path: data/TIMIT-sentence-type-article
features_subdir: default
index_column: path
target_column: sentence_type
file_type: wav
file_handler: autrainer.datasets.utils.AudioFileHandler

criterion: autrainer.criterions.BalancedCrossEntropyLoss
metrics:
  - autrainer.metrics.Accuracy
  - autrainer.metrics.UAR
  - autrainer.metrics.F1
tracking_metric: autrainer.metrics.Accuracy

transform:
  type: raw
  base:
    # 124621 is the longest utterance in the recovered 6300-file corpus and
    # maps to the article's 779-frame PANN input. Padding runs after noise so
    # padded samples stay zero and SNR is defined on the recorded utterance.
    - autrainer.transforms.Expand:
        size: 124621
        axis: -1
        order: -100
